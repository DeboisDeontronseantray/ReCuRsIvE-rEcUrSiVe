name: CI checks

on:
  push:
    branches: [main, ci-checks, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            prompts/system-v5-draft/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r prompts/system-v5-draft/requirements.txt

      - name: Syntax and YAML lint
        run: bash scripts/ci_syntax_check.sh

      - name: Block owner real name (whole-word scan)
        env:
          OWNER_REAL_NAME_B64: ${{ secrets.OWNER_REAL_NAME_B64 }}
        run: python3 scripts/ci_name_scan.py

      - name: Test suites (root, v5, dryrun, legacy)
        run: bash scripts/ci_run_tests.sh

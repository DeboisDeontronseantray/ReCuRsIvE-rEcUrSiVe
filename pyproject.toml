[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-charmeta"
version = "0.1.0"
description = "Per-channel character-meta companion store, trait observations, and promotion."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
charmeta-promote = "charmeta.promote:main"
lineage-derive-aired = "lineage.derive_aired:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["charmeta*", "lineage*"]
namespaces = false

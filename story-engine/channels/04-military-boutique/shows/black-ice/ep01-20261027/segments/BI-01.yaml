  [Action] HERON sits on a crate on the ferry deck slowly working the bolt of her suppressed rifle with a rag; she pauses, lifts her head toward frame right, then resumes.

  [Environment] Dusk ferry landing, ice floes drift right to left across grey water, light snow, fog on the far bank, the hut at frame right.

  [Physics] Ferry rocks gently as floes knock the hull, steel cable sags and drips, lantern flame flickers, breath vapor.

  [Audio] No music. No dialogue. River current, grinding ice, low wind, slow breathing.

  [SFX] Rifle bolt slide, rag on steel, ice knocking timber, cable creak, faint radio static from a bag.

  [Constraints] One continuous shot, no cuts. Fictional adults only. Every lamp, bulb and lantern glows signal orange, never green. Strictly photorealistic live action. No text, no subtitles, no signage, no logos, no insignia, no brands, no readable dials. No eye contact with camera, eyeline off-lens; characters never look into the lens.'

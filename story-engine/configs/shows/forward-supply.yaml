world_facts:
  - Couriers wear brass shift tags that double as store loyalty chips.
  - Every product comes with a fake "clearance level" sticker invented by Mira S'mirin'.
  - The depot motto is "Ship It Forward" — never explain where.
  - "House fiction: all gear is original to the channel. No real defense brands or game IPs."
  - "Gear rule: the majority of gear and merchant items are absurd military equipment that is still realistic and logically consistent."
  - The quarterly inspection has no date, no inspector, and total authority.
  - Clearance colors are not on any chart; Mira S'mirin' invents them live.
running_gags:
  - Mira S'mirin' invents a new clearance color each episode and Bill pretends he knew it.
  - Tim chirps when "signal drifts," usually mid-pitch.
  - Osmund brings the wrong pack; it somehow fits the new brief.
  - Bill salutes a pedestal before the reveal.
season_arc:
  main: >
    Depot must clear a backlog of absurd "priority briefs" before the quarterly
    inspection nobody can define. Each episode ships one impossible order and
    invents the paperwork to match.
  side_arcs:
    - Mira's clearance-color chart grows until it needs its own vitrine.
    - Tim keeps delivering a mysterious blank envelope Bill will not open.
    - Osmund trains for "inspector handshake protocol" that does not exist.
  episode_count: 8
  episode_beats:
    - "E1 Cold Clearance — first invented color; helmet pedestal demo; Osmund wrong pack."
    - "E2 Signal Drift — Tim chirps through a live brief; scout-drone jewelry pitch."
    - "E3 Velvet Brief — binoculars on velvet; Bill salutes the wrong pedestal."
    - "E4 Gauntlet Protocol — exo-gauntlet vitrine; Mira S'mirin' adds 'ultraviolet taupe' clearance."
    - "E5 Bay Fog — modular field pack demo in Depot Bay; inspection rumor spikes."
    - "E6 Cloak Hour — graphite cloak torso plate; blank envelope returns."
    - "E7 Cruiser Window — armored showroom cruiser B-roll; Osmund almost gets an order right."
    - "E8 Quarterly Maybe — backlog cleared on paper; inspector never arrives; motto card."

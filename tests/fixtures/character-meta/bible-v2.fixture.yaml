prompt_queue_rule:
  status: locked
  source: "Trundle 2026-10-27 18:05 CT"
  rule: Comment prompts are never deleted. State is waiting, combined, aired or held, and changes only through new add-only rows. Prompts that fit together (same show, premise or character) merge into one clip whose prompt_ids list every included prompt; all count as used. Wait time raises priority; max_wait_loops defaults to 3 (configurable); at max wait a prompt takes the next clean break ahead of new prompts. A prompt failing a filter is held with its reason and rewritten safely if possible.
  enforcement: live/checker.py next_for_break, combine, hold_prompt; tests/test_prompt_queue.py
duplicate_rule:
  status: locked
  source: "Trundle 2026-10-27 18:05 CT"
  rule: Premise fingerprint (show + premise keywords or embedding). A near-duplicate becomes a sibling in the existing lineage, then (a) same idea rotates in the slot, (b) a new take becomes the next episode or a callback, (c) a far drift spins off a new lineage with a link back. Exact copies (same sha or phash) air once; the extra copies are kept as linked duplicates, never dropped.
  enforcement: live/checker.py fingerprint, classify_duplicate, register_clip
prompt_states_rule:
  source: /workspace/shared/streaming/CLIP-PROMOTION-PROCESS-20261027.md#18:09
  open: [WAITING, PARKED]
  terminal: [AIRED, MERGED, WITHDRAWN]
  withdrawn_by: Trundle only
  read_aliases: {waiting: WAITING, combined: MERGED, held: PARKED, aired: AIRED}
  skipped_breaks_cap: 3
  cap_guarantees_next_break: true
  supersedes_state_names_in: prompt_queue_rule
negative_tag_note_20261027_1820:
  replaced: "no text reading [real first name]"
  with: "no personal names"
  by: Story Bot 18:20 CT
  note: "Supersedes the old wording in hard_rules and changelog. Matching still done by checker.creator_name_hits; the name is never put in a prompt."
overlay_text_rule:
  set_by: Trundle 2026-10-27 18:29 CT
  extract: [prices, labels, captions, signs, quoted says/reads/with-the-words text]
  never_baked_into_generation: true
  gen_prompt_constraint: "no readable text, no signage lettering"
  overlay_spec_fields: [text, kind, position, start_s, end_s, style, prompt_id, blocked, airable]
  burn_in: post-process on separate copy (same as genealogy tag)
  clean_master_is_parent_for: [mutations, anchor_frames]
  filters: [no Trundle, no kids, no real brands, no money/donation/tip lines, no Military Boutique text]
  editable_without_rerender: true
  code: checker.split_overlay_text, checker.gen_prompt_requests_text, checker.overlay_specs_for


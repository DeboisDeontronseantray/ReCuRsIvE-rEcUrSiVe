observational_rule:
  source: "Trundle 2026-10-27 16:51 CT: a window into the life of these three people and a floating brain"
  rule: Characters never look into or address the camera. Fly-on-the-wall, observational framing; eyelines stay on each other, their work, or off-frame. Cast = Bill, Mira, Osmund (people) + Tim (floating cybernetic brain).
  prompt_tail: "Observational fly-on-the-wall framing; no one looks at or addresses the camera; eyelines on each other or their task."
  scope_20261028: {applies_to: "Forward Supply only (the retired Ch 4 three-hosts-and-a-floating-brain show: Bill, Mira, Osmund, Tim)", global: false, channel_wide: false, not_for: [BLACK ICE, other shows, other channels], note: "Black Ice keeps its own separate opt-in no-eye-contact line in its _wrapper.md", source: "Trundle 2026-10-28 12:33 CT; Director wording"}
  scope_correction_20261028: {note: "Only the 'window into lives' observational framing is Forward Supply-only. No eye contact with the camera is GLOBAL: every character, every show, every channel.", supersedes: scope_20261028 (eye-contact part only), source_quote: '"Hey man just a heads up, for future reference. Characters should never look into the camera. Maybe on a 4th wall break, but most 4th wall breaks will be nuanced/subtle, not just looking into the camera" (Trundle, Oct 28 2026 10:41 AM CT, Director chat t33u)', recorded_by: "Story Bot 2026-10-28 12:45 CT, Director spec"}
  remake_rule: "Trundle 2026-10-27 17:27 CT ('Rerun with them NOT looking into the cameras, yes.'): remakes must have no eye contact with the camera; every remake prompt carries side/three-quarter framing, explicit eyelines, and no-eye-contact negatives."
audio_rule:
  source: "Trundle 2026-10-27 17:33 CT: the newest product clips have a loud, annoying low hum"
  applies_to: [product clips, product stills, house ads, catalog b-roll]
  rule: Quiet, unobtrusive ambient bed. No droning low hum, no sub-bass rumble, no engine drone. Dialogue and VO stay clearly audible above the bed (VO-friendly level).
  prompt_line: "Audio: quiet, unobtrusive ambient bed (soft room tone, faint servo ticks, light showroom air); no droning low hum, no sub-bass rumble, no engine drone; dialogue and VO sit clearly above the bed."
  negative_tags: [no low hum, no droning bass, no sub-bass rumble, no engine drone]
hard_rules:
  no_creator_name_on_screen:
    source: "Trundle 2026-10-27 17:43 CT (hard rule)"
    rule: His real first name must never appear on screen in any video (prompts, overlays, captions, supers, snippets, end cards). Checker and intake fail any on-screen text containing trundle (whole word, any case).
    negative_tags: [no names, no signatures, no watermarks]
    enforcement: live/checker.py creator_name_hits; live/intake.py moderate + load_snippets; OCR scan list /workspace/streaming/UNUSABLE-20261027.jsonl
  no_military_boutique_burned_text:
    source: "Trundle 2026-10-27 17:43 CT"
    rule: Product and house-ad videos with MILITARY BOUTIQUE visible on screen are older versions and are pulled as unusable (see UNUSABLE-20261027.jsonl).
  no_trundle_name_20261027_1744:
    source: "Trundle 2026-10-27 17:44 CT, revised 17:46 CT (hard rule)"
    rule: "Never write his real first name in any prompt, overlay, caption, super, script, VO or dialogue; the name must never appear on screen or be spoken in any new video. Existing clips that show his real first name are NOT pulled: cover the word with a solid black box (status needs_name_cover; boxes and time ranges in /workspace/streaming/NAME-COVER-20261027.json). Spoken use of his real first name in existing audio is flagged for a VO fix."
    negative_tags: [no on-screen names, no text reading his real first name]
    enforcement: live/checker.py creator_name_hits (whole word, any case); live/intake.py negative_prompt; /workspace/streaming/PULLED-20261027.jsonl
  no_kids_20261027_1744:
    source: "Trundle 2026-10-27 17:44 CT (hard rule)"
    rule: Any clip that mentions or shows kids, children, a child, toddlers or babies is pulled as unusable. The Drawbridge Puffs commercial is pulled for this (every copy).
    negative_tags: [no children, no kids]
    enforcement: live/checker.py kid_hits (kid/kids/child/children/toddler/baby/babies, whole word, negated phrases ignored); /workspace/streaming/PULLED-20261027.jsonl rule kids
  no_military_boutique_clip_text_20261027_1744:

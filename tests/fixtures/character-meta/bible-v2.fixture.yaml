workflow:
  status: in_progress
  overlay_variants_ref: 'Sales overlays run as two post-only variants; see overlay_variants_decision_20261027. Nothing airs without Trundle yes.'
  order:
  - 1. Storyboard first (scenes, wants, conflicts, product uses, linked shots).
  - '2. Hybrid: team writes script by hand.'
  - 3. Log threads/relationships/product uses to engine continuity (data/continuity/forward-supply.json), marked not-aired.
  - 4. Engine outline audit against this Bible + aired_history before CNB export.
  - 5. Trundle review; CNB renders; Trundle yes before anything airs.
  house_ads: Only at clean breaks between story segments; never inside a scene.
  run_plan: Run 1 accepted -> run 2 quick, as if live -> improvements -> commenter-prompt integration -> run 3 (live if needed, Trundle's yes). Votes disregarded for commenter prompts on runs 2 and 3.
  commenter_vision:
    status: draft (rules still to be written)
    note: 'TRUNDLE 2026-10-27 15:14 CT, CORE VISION (one of the most important parts of the livestream). (1) The first generation of content on the channels is the FOUNDATION that will be mutated and memed.
      (2) Commenters steer the genealogy of shows and channels, character development (likely erratic), words spoken, settings and more, while coherence and continuity are kept throughout. (3) Memes rule,
      but there must be levers for real-time data and for characters'' self-reflection. Example: when a commenter prompt makes a character act out of character, the character can say something like ''idk
      why I''m doing this but [commenter handle] thinks it''s a good idea.'' (4) This is a self-improving, adaptive system steered by prompt snippets or headers inserted around the commenter''s prompt,
      never replacing what the commenter asked for. (5) Goal: monitor X comments and start videos using all existing rules plus the commenter-prompt rules still to be written. Applies after run 2 (see voice-post-and-run-plan-20261027-1443).
      Still bound by: TV-safe, banned list, no real brands, home-only, and anything airing needs Trundle''s yes.'
  promotion_workflow:
    steps:
    - 1. Assemble clip prompt from locked_base + current approved/proposed variables (see docs/VIDEO-GEN-FLOW-CH04.md). Never paste inspiration_notes IP/studio names into prompts.
    - 2. After a render or still review, log one or more observations rows on that clip_id (variable_id + note + proposed_change).
    - '3. Trundle decides per observation: approved / rejected / deferred.'
    - '4. On approved: bump variable.version, set current to proposed_change, set status:approved, approved_by:Trundle, approved_at:date; set observation.promoted_to_version.'
    - '5. Reference stills are OPTIONAL (Trundle 2026-10-27 11:14: none needed before pilot). When used: attach image_path, list qualities_locked, status moves none→candidate→locked only on Trundle OK. Still
      locks qualities, not pixels. Pilot/first gen may run with empty slots.'
    - '6. After air / accepted CNB render: append aired_history with real events. Callbacks = those real events only. Generation quirks go in generation_quirks (optional tricks, never auto-callbacks).'
    - '7. Intended on-screen text: register in on_screen_text; apply consistently in post.'
    - 8. Never loosen locked_base tv_safe / banned / no_dial / no_slapstick / Trundle-products-only.
    rules:
    - No auto-promotion. Story Bot does not silently edit approved variables.
    - Smoke/test text (data/smoke/...) is not aired_history.
    - Story Bot writes stories from Director's handoffs only and does not send clip prompts to CNB. Nothing airs/publishes/posts without Trundle OK.
    - Callbacks are real prior-clip events. Generation quirks are optional and separate.
    status_v2: in_progress
  engine: Use engine season arcs, episode beats, outline audit, slots, continuity, CNB export where they fit (trundle-rules-20261027-1404).
